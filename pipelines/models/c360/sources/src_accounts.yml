
models:
- name: src_accounts
  description: ""
  config:
    contract:
      enforced: true
  columns:
  - name: account_id
    data_type: varchar(2147483647)
    constraints:
      - type: not_null
      - type: primary_key
        expression: "not enforced"
  - name: customer_id
    data_type: string
  - name: account_type
    data_type: string
  - name: currency
    data_type: string
  - name: balance
    data_type: double
  - name: point_balance
    data_type: double
  - name: opened_date
    data_type: int
  - name: status
    data_type: string
