
models:
- name: src_customers
  description: ""
  config:
    contract:
      enforced: true
  columns:
  - name: customer_id
    data_type: string
    constraints:
      - type: not_null
      - type: primary_key
        expression: "not enforced"
  - name: first_name
    data_type: string
  - name: last_name
    data_type: string
  - name: email
    data_type: string
  - name: phone
    data_type: string
  - name: date_of_birth
    data_type: int
  - name: gender
    data_type: string
  - name: registration_date
    data_type: string
  - name: customer_segment
    data_type: string
  - name: customer_since
    data_type: int
  - name: city
    data_type: string
  - name: state
    data_type: string
  - name: postal_code
    data_type: string
  - name: country
    data_type: string
  - name: event_ts
    data_type: timestamp_ltz

