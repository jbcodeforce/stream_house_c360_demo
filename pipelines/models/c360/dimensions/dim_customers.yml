
models:
- name: dim_customers
  description: ""
  config:
    contract:
      enforced: true
  columns:
  - name: customer_id
    data_type: string
    constraints:
      - type: not_null
      - type: primary_key
        expression: "not enforced"
  - name: first_name
    data_type: string
  - name: last_name
    data_type: string
  - name: date_of_birth
    data_type: integer
  - name: gender
    data_type: string
  - name: registration_date
    data_type: string
  - name: customer_segment
    data_type: string
  - name: customer_since
    data_type: integer
  - name: city
    data_type: string
  - name: state
    data_type: string
  - name: postal_code
    data_type: string
  - name: country
    data_type: string
  - name: event_ts
    data_type: timestamp_ltz
  - name: age_years
    data_type: integer
  - name: days_since_registration
    data_type: integer
  - name: generation_segment
    data_type: string
  - name: missing_email_flag
    data_type: integer
  - name: missing_phone_flag
    data_type: integer