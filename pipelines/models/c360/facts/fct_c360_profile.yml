models:
- name: fct_c360_profile
  description: ""
  columns:
  - name: customer_id
    data_type: string
    constraints:
      - type: not_null
      - type: primary_key
        expression: "not enforced"
  - name: first_name
    data_type: string
  - name: last_name
    data_type: string
  - name: customer_segment
    data_type: string
  - name: customer_since
    data_type: timestamp_ltz
  - name: gender
    data_type: string
  - name: city
    data_type: string
  - name: state
    data_type: string
  - name: postal_code
    data_type: string
  - name: country
    data_type: string
  - name: age_years
    data_type: integer
  - name: days_since_registration
    data_type: integer
  - name: generation_segment
    data_type: string
  - name: missing_email_flag
    data_type: integer
  - name: missing_phone_flag
    data_type: integer
  - name: account_count
    data_type: BIGINT
  - name: total_balance
    data_type: decimal
  - name: txn_count
    data_type: BIGINT
  - name: txn_total
    data_type: decimal