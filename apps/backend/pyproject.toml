[project]
name = "c360-backend"
version = "0.1.0"
description = "Customer 360 backend — FastAPI Customers microservice with PostgreSQL and Kafka sinks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "psycopg2-binary>=2.9.10",
    "confluent-kafka>=2.8.0",
    "fastavro>=1.10.0",
    "pydantic-settings>=2.9.0",
    "python-dotenv>=1.1.0",
    "certifi>=2026.7.22",
    "httpx>=0.28.1",
    "authlib>=1.8.0",
    "cachetools>=7.2.0",
    "attrs>=26.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-anyio>=0.0.0",
]
